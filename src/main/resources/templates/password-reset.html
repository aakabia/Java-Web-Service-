<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Reset Your Password</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          background-color: #f5f5f5;
          margin: 0;
          padding: 0;
          display: flex;
          height: 100vh;
          justify-content: center;
          align-items: center;
        }
        .container {
          background: white;
          padding: 30px 40px;
          border-radius: 8px;
          box-shadow: 0 4px 15px rgba(0,0,0,0.1);
          max-width: 400px;
          width: 100%;
        }
        h1 {
          text-align: center;
          color: #2563eb;
          margin-bottom: 20px;
        }
        label {
          display: block;
          font-size: 14px;
          font-weight: bold;
          margin-bottom: 6px;
          color: #333;
        }
        input {
          width: 100%;
          padding: 10px;
          margin-bottom: 15px;
          border: 1px solid #ccc;
          border-radius: 4px;
          font-size: 14px;
        }
        input:focus {
          border-color: #2563eb;
          outline: none;
        }
        .button-submit {
          width: 100%;
          background-color: #2563eb;
          color: white;
          padding: 12px;
          font-size: 16px;
          border: none;
          border-radius: 5px;
          cursor: pointer;
        }
        .button-submit:hover {
          background-color: #1e40af;
        }
        .error-message {
          background-color: #ffe6e6;
          color: #cc0000;
          padding: 10px;
          border-radius: 5px;
          margin-bottom: 15px;
          text-align: center;
          display: none; /* hidden by default */
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Reset Your Password</h1>

    <div id="error" class="error-message"></div>

    <form id="resetForm">
        <label for="verificationCode">Verification Code</label>
        <input type="text" id="verificationCode" name="verificationCode" placeholder="Enter the code you received" required />

        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required />

        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required />

        <button id="resetBtn" type="submit" class="button-submit">Reset Password</button>
    </form>
</div>
<script src="/js/change-password.js"></script>
</body>
</html>
