<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Email Could Not Be Sent</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            text-align: center;
        }
        h1 {
            color: #dc2626; /* red */
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            color: #333;
            margin-bottom: 20px;
        }
        .button-link {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .button-link:hover {
            background-color: #1e40af;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Email Could Not Be Sent</h1>
    <p>
        We were unable to send the verification email at this time.
    </p>
    <p>
        Please try again later. If the problem persists, contact support.
    </p>
    <p>
        <a th:href="@{${FRONT_END_DEV_URL}}" class="button-link">Back to Landing Page</a>
    </p>
</div>
</body>
</html>
