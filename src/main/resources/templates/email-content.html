<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Email Verification</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f5f5f5; padding: 20px;">
<div style="max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 4px;">
    <h1 style="
      width: 60px;
      height: 60px;
      line-height: 60px;
      margin: 0 auto 15px;
      text-align: center;
      border-radius: 50%;
      background-color: #2563eb;
      color: white;
      font-size: 36px;
      font-weight: bold;
    ">T</h1>

    <h2 style="text-align: center; margin-top: 0;">Verify Your Email</h2>

    <p>Hello <span th:text="${user.firstName}"></span>,</p>

    <p style="margin-bottom: 20px;">Please click the link below to verify your email address for <span th:text="${user.username}"></span>:</p>

    <p style="text-align: center; margin-bottom: 50px;">
        <a th:href="@{${BACK_END_DEV_URL} + '/verify?token=' + ${user.opaqueToken}}" style="
        background-color: #2563eb;
        color: white;
        padding: 10px 15px;
        text-decoration: none;
        border-radius: 3px;
        display: inline-block;
      ">Verify Email</a>
    </p>

    <p style="margin-bottom: 20px;">If the button doesn’t work, copy and paste this URL into your browser:</p>

    <p style="word-break: break-word; color: #2563eb; margin-bottom: 40px;">
        <a th:href="@{${BACK_END_DEV_URL} + '/verify?token=' + ${user.opaqueToken}}" th:text="@{${BACK_END_DEV_URL} + '/verify?token=' + ${user.opaqueToken}}"></a>
    </p>

    <p style="margin-bottom: 20px;">Thank you!</p>

    <hr />

    <p style="font-size: 12px; color: #777; text-align: center;">© 2025 My Company</p>
</div>
</body>
</html>
