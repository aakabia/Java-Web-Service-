<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Password Reset Email Sent</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          background-color: #f5f5f5;
          margin: 0;
          padding: 0;
          display: flex;
          height: 100vh;
          justify-content: center;
          align-items: center;
        }
        .container {
          background: white;
          padding: 30px 40px;
          border-radius: 8px;
          box-shadow: 0 4px 15px rgba(0,0,0,0.1);
          max-width: 450px;
          text-align: center;
        }
        h1 {
          color: #2563eb;
          margin-bottom: 20px;
        }
        p {
          font-size: 16px;
          color: #333;
          margin-bottom: 20px;
        }
        .checkmark {
          font-size: 50px;
          color: #16a34a; /* green */
          margin-bottom: 20px;
        }
        .button-link {
          display: inline-block;
          background-color: #2563eb;
          color: white;
          padding: 12px 24px;
          font-size: 16px;
          text-decoration: none;
          border-radius: 5px;
          cursor: pointer;
        }
        .button-link:hover {
          background-color: #1e40af;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="checkmark">&#10004;</div> <!-- Unicode checkmark -->
    <h1>Password Reset Email Sent</h1>
    <p>
        A password reset email has been sent to <strong th:text="${user.email}">your email</strong>.
    </p>
    <p>
        Please check your inbox for the reset link or reset code to change your password.
    </p>
    <p>
        <a th:href="@{${FRONT_END_DEV_URL} + '/auth/login'}" class="button-link">Go to Login</a>
    </p>
</div>
</body>
</html>
