<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Password Change Failed</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          background-color: #f5f5f5;
          margin: 0;
          padding: 0;
          display: flex;
          height: 100vh;
          justify-content: center;
          align-items: center;
        }
        .container {
          background: white;
          padding: 30px 40px;
          border-radius: 8px;
          box-shadow: 0 4px 15px rgba(0,0,0,0.1);
          max-width: 450px;
          text-align: center;
        }
        h1 {
          color: #dc2626; /* red */
          margin-bottom: 20px;
        }
        p {
          font-size: 16px;
          color: #333;
          margin-bottom: 20px;
        }
        .crossmark {
          font-size: 50px;
          color: #dc2626; /* red */
          margin-bottom: 20px;
        }
        .error-message {
          font-weight: bold;
          color: #b91c1c; /* darker red */
          margin-bottom: 20px;
        }
        .button-link {
          display: inline-block;
          background-color: #2563eb;
          color: white;
          padding: 12px 24px;
          font-size: 16px;
          text-decoration: none;
          border-radius: 5px;
          cursor: pointer;
        }
        .button-link:hover {
          background-color: #1e40af;
        }
        .contact-support {
          font-size: 14px;
          color: #555;
          margin-top: 15px;
        }
        .contact-support a {
          color: #2563eb;
          text-decoration: none;
        }
        .contact-support a:hover {
          text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="crossmark">&#10006;</div>
    <h1>Password Change Failed</h1>
    <p class="error-message">
        Your password update has failed!
    </p>
    <p>
        Please check the information provided and try again.
    </p>
    <p>
        <a th:href="@{${FRONT_END_DEV_URL} + '/auth/login'}" class="button-link">Go to Login</a>
    </p>
    <p class="contact-support">
        Contact support at <a href="mailto:azizkabai26@yahoo.com">azizkabai26@yahoo.com</a>
    </p>
</div>
</body>
</html>
