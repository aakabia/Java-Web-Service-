<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Account Information</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f5f5f5; padding: 20px;">
<div style="max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 4px;">
    <!-- Logo Circle -->
    <h1 style="
      width: 60px;
      height: 60px;
      line-height: 60px;
      margin: 0 auto 15px;
      text-align: center;
      border-radius: 50%;
      background-color: #2563eb;
      color: white;
      font-size: 36px;
      font-weight: bold;
    ">T</h1>

    <!-- Title -->
    <h2 style="text-align: center; margin-top: 0;">Account Information</h2>

    <!-- Greeting -->
    <p>Hello <span th:text="${user.firstName}"></span>,</p>

    <!-- Username Highlight Section -->
    <p style="margin-bottom: 20px;">
        Your username for login is:
    </p>
    <div style="background-color: #f0f4ff; border: 1px solid #2563eb; padding: 15px; text-align: center; border-radius: 4px; font-size: 18px; font-weight: bold; letter-spacing: 1px; margin-bottom: 30px;">
        <span th:text="${user.username}">username_here</span>
    </div>

    <!-- Login Button -->
    <p style="text-align: center; margin-bottom: 30px;">
        <a th:href="@{${FRONT_END_DEV_URL} + '/auth/login'}" style="
            background-color: #2563eb;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 3px;
            display: inline-block;
        ">Go to Login</a>
    </p>

    <!-- Contact Support -->
    <p class="contact-support" style="text-align: center; font-size: 12px; color: #777;">
        Contact support at <a href="mailto:azizkabai26@yahoo.com">azizkabai26@yahoo.com</a>
    </p>

    <!-- Footer -->
    <hr />
    <p style="font-size: 12px; color: #777; text-align: center;">© 2025 My Company</p>
</div>
</body>
</html>
