
frontend:
  base-url: ${FRONT_END_URL} # change in production

backend:
  base-url: ${BACK_END_URL} # change in production

spring:
  datasource:
    url: jdbc:h2:mem:mydb
    username: sa
    password: password
    driverClassName: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_EMAIL_ADDRESS}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    jwt:
      secret-key: ${SECRET}
      expiration-time: 300000
      refresh-token:
        expiration: 900000
      verification-token:
        expiration: 180000